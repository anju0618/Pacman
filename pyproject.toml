[project]
name = "packman"
version = "0.1.0"
description = "A Pac-Man clone built for the 42 curriculum."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mazegenerator",
    "pydantic>=2.13.4",
    "pygame>=2.6.1",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
]

[tool.uv.sources]
mazegenerator = { path = "package/mazegenerator-2.1.0-py3-none-any.whl" }

[tool.mypy]
explicit_package_bases = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
# 課題要件どおり `mypy .` でプロジェクト全体を検査できるようにするため、
# 自分たちが書いていないコード(仮想環境・外部パッケージ)は除外する。
exclude = '^(\.venv|package|build|dist)/'
